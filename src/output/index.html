<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; media-src 'self' file:; style-src 'self' 'unsafe-inline'">
<title>EasyDayeg Output</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #bg, #bg img, #bg video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #bg { transition: opacity .4s; }
  #text {
    position: absolute; inset: 6vh 6vw; display: flex; align-items: center; justify-content: center;
    text-align: center; white-space: pre-line; color: #fff; font-family: "Helvetica Neue", Arial, sans-serif;
    font-weight: 600; line-height: 1.25; text-shadow: 0 0.04em 0.12em rgba(0,0,0,.85);
    transition: opacity .3s;
  }
  #black { position: absolute; inset: 0; background: #000; opacity: 0; transition: opacity .4s; }
  .hidden { opacity: 0 !important; }
  .on { opacity: 1 !important; }
</style>
</head>
<body>
  <div id="bg"></div>
  <div id="text"></div>
  <div id="black"></div>
  <script src="../shared/render.js"></script>
  <script src="output.js"></script>
</body>
</html>
