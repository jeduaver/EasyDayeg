<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>EasyDayeg Stage</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  body { display: grid; grid-template-rows: auto 1fr auto 0.6fr; gap: 1vh; padding: 2vh 3vw; box-sizing: border-box; }
  .label { font-size: 2.2vh; letter-spacing: .15em; text-transform: uppercase; color: #8a8f98; display: flex; justify-content: space-between; }
  #clock { color: #fff; font-variant-numeric: tabular-nums; font-size: 3vh; letter-spacing: 0; }
  #current { font-size: 7vh; font-weight: 600; white-space: pre-line; line-height: 1.2; overflow: hidden; }
  #next { font-size: 4.5vh; color: #f5c84c; white-space: pre-line; line-height: 1.2; overflow: hidden; }
  #title { color: #ccc; letter-spacing: 0; text-transform: none; }
</style>
</head>
<body>
  <div class="label"><span>Current <span id="title"></span></span><span id="clock"></span></div>
  <div id="current"></div>
  <div class="label"><span>Next</span></div>
  <div id="next"></div>
  <script src="stage.js"></script>
</body>
</html>
